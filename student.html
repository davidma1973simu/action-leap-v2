<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#4f46e5" />
<title>学员端 · 学习迁移</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<style>
  :root{
    --bg:#f4f5fa; --surface:#ffffff; --surface-2:#fbfcfe;
    --ink:#1a2233; --ink-2:#5b6478; --ink-3:#9aa2b4;
    --line:#e9ecf3; --line-2:#f1f3f8;
    --primary:#4f46e5; --primary-600:#4338ca; --primary-soft:#eef0ff; --primary-ring:rgba(79,70,229,.20);
    --success:#15a36e; --success-soft:#e7f7ef;
    --warn:#b9791b; --warn-soft:#fbf2e2;
    --danger:#e0524d;
    --r:22px; --r-sm:15px;
    --font:"Outfit",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --nav-h:62px;
    --brand:#4f46e5; --brand-deep:#4338ca; --brand-soft:#eef0ff; --brand-50:#f5f6ff;
    --brand-line:#c7cbff; --brand-glow:rgba(79,70,229,.18);
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:40px;
    --r-xs:8px;--r-sm:13px;--r-md:14px;--r-lg:18px;--r-xl:26px;--r-full:999px;
    --sh-xs:0 1px 2px rgba(26,34,51,.04),0 2px 6px rgba(26,34,51,.05);
    --sh-sm:0 2px 8px rgba(26,34,51,.05),0 8px 20px rgba(26,34,51,.07);
    --sh-brand:0 10px 30px rgba(79,70,229,.10),0 3px 8px rgba(79,70,229,.06);
    --fs-2xs:11px;--fs-xs:12px;--fs-sm:13px;--fs-base:14px;--fs-md:15px;--fs-lg:17px;
    --fs-xl:21px;--fs-2xl:27px;
    --lh-tight:1.18;--lh-snug:1.34;--lh-loose:1.75;
    --fw-4:400;--fw-5:500;--fw-6:600;--fw-7:700;--fw-8:800;
    --ls-tight:-.02em;--ls-snug:-.01em;--ls-wide:.02em;
    --ease-spring:cubic-bezier(.16,1,.3,1);--ease-out:cubic-bezier(.22,1,.36,1);
    --dur-fast:.18s;--dur:.28s;--dur-slow:.5s;
    --font-sans:"Outfit",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
       -webkit-font-smoothing:antialiased;
       background-image:radial-gradient(700px 360px at 100% -8%,var(--brand-50),transparent 60%);
       background-attachment:fixed}
  .phone{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;background:var(--surface);
         display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(26,34,51,.10)}
  .page{flex:1;overflow-y:auto;padding:0 18px calc(var(--nav-h) + 28px);-webkit-overflow-scrolling:touch}

  /* 顶部问候 */
  .topbar{position:sticky;top:0;z-index:20;background:var(--brand);
         color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hi{font-size:14px;opacity:.86;font-weight:600}
  .who{font-size:19px;font-weight:800;margin-top:2px}
  .who .role{font-size:12px;font-weight:600;opacity:.8;margin-left:8px;
             background:rgba(255,255,255,.18);padding:2px 9px;border-radius:999px}
  .bell{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);
        display:flex;align-items:center;justify-content:center;font-size:18px}

  /* 框架卡 */
  .idcard{margin:-14px 16px 0;position:relative;z-index:5;background:#fff;border-radius:16px;
          padding:15px 17px;box-shadow:0 8px 22px rgba(16,24,40,.07);border:1px solid var(--line);overflow:hidden}
  .idcard::before{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle,var(--brand-soft),transparent 70%);pointer-events:none}
  .idcard .lbl{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.3px}
  .idcard .txt{font-size:15.5px;font-weight:700;margin-top:3px;line-height:1.5}
  .idcard .txt b{color:var(--primary-600)}
  .idcard .sub{font-size:12.5px;color:var(--ink-2);margin-top:6px}
  .idcard .mark{position:absolute;right:14px;top:13px;color:var(--brand);opacity:.42}
  .idcard .mark .ic-svg{width:22px;height:22px}

  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 14px}
  .sec h2{font-size:16px;font-weight:800;margin:0;letter-spacing:.2px}
  .sec .prog{font-size:13px;color:var(--ink-2);font-weight:600}
  .sec .prog b{color:var(--primary);font-size:15px}

  /* 行为卡片（迁移记录器） */
  .habits{display:flex;flex-direction:column;gap:13px}
  .habit{display:flex;gap:13px;padding:16px 17px;background:var(--surface);border:1.5px solid var(--line);
         border-radius:18px;cursor:pointer;transition:transform var(--dur) var(--ease-spring),box-shadow var(--dur) var(--ease-out),border-color var(--dur-fast);align-items:flex-start;
         box-shadow:var(--sh-xs)}
  .habit:hover{border-color:var(--brand-line);box-shadow:var(--sh-sm)}
  .habit:active{transform:scale(.985)}
  .ring{width:26px;height:26px;border-radius:50%;flex:0 0 26px;margin-top:2px;position:relative;
        background:var(--line);transition:.2s}
  .ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
  .habit.done .ring{background:var(--success)}
  .habit.done .ring::after{display:none;content:"✓";color:#fff;font-size:15px;font-weight:800;
        display:flex;align-items:center;justify-content:center;inset:0}
  .habit.locked{opacity:.55;cursor:not-allowed}
  .habit.locked:hover{border-color:var(--line);box-shadow:var(--sh-xs)}
  .habit .main{flex:1;min-width:0}
  .habit .desc{font-size:15px;font-weight:700;line-height:1.45}
  .habit .meta{font-size:12px;color:var(--ink-3);margin-top:3px}
  .habit .why{font-size:12px;color:var(--ink-2);margin-top:7px;padding:8px 10px;background:var(--brand-50);
              border-radius:10px;line-height:1.5}
  .habit .why b{color:var(--primary-600)}
  .habit .result{font-size:12.5px;color:var(--ink-2);margin-top:7px;padding:8px 10px;background:var(--success-soft);
              border-radius:10px;line-height:1.5}
  .habit .result b{color:#0f6e56}
  .habit .daybadge{font-size:11px;font-weight:700;color:var(--primary-600);background:var(--primary-soft);
              padding:2px 9px;border-radius:999px;display:inline-block;margin-top:8px}
  .habit .kind{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;display:inline-block;margin-top:8px;margin-left:6px}
  .habit .kind.key{background:#fbeaf0;color:#993556}
  .habit .kind.micro{background:var(--success-soft);color:#0f6e56}
  .habit .st{font-size:12px;font-weight:700;white-space:nowrap;align-self:center}
  .habit.done .st{color:var(--success)}
  .habit.locked .st{color:var(--ink-3)}
  .empty{text-align:center;color:var(--ink-3);padding:40px 20px;font-size:14px}

  /* 底部导航 */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;
       height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
       background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
       display:flex;z-index:30}
  .nav button{flex:1;border:0;background:none;font-family:var(--font);color:var(--ink-3);
              font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;
              justify-content:center;gap:4px;cursor:pointer}
  .nav button .ic{font-size:21px;line-height:1}
  .nav button.on{color:var(--primary)}
  .nav button.on .ic{transform:translateY(-1px)}

  /* 框架（只读） */
  .loop{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:13px;overflow:hidden}
  .loop-head{padding:15px 16px;display:flex;align-items:center;gap:11px;cursor:pointer}
  .loop-head .n{width:26px;height:26px;border-radius:9px;background:var(--primary-soft);color:var(--primary-600);
                font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
  .loop-head .t{font-size:15px;font-weight:700;flex:1}
  .loop-head .arr{transition:.2s;color:var(--ink-3);font-size:13px}
  .loop.open .loop-head .arr{transform:rotate(180deg)}
  .loop-body{padding:0 16px 16px;display:none}
  .loop.open .loop-body{display:block}
  .challenge{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;
             padding:9px 11px;margin-bottom:12px}
  .task{padding:12px 0;border-top:1px dashed var(--line-2)}
  .task:first-child{border-top:0}
  .task .tt{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
  .task .td{font-size:12.5px;color:var(--ink-2);margin-top:4px}
  .sub-h{font-size:11.5px;font-weight:700;color:var(--ink-3);margin:11px 0 6px;letter-spacing:.3px}
  .mrow{display:flex;gap:8px;padding:7px 0;font-size:13px}
  .mrow .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:7px;flex:0 0 6px}
  .mrow .mn{font-weight:600}.mrow .md{color:var(--ink-2);font-size:12px}
  .six{background:var(--surface-2);border-radius:10px;padding:10px 11px;margin-top:8px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
  .six b{color:var(--primary-600)}

  /* 进展 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
  .stat{background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:14px 10px;text-align:center}
  .stat .num{font-size:26px;font-weight:800;color:var(--primary);line-height:1}
  .stat .lbl{font-size:11.5px;color:var(--ink-2);margin-top:6px}
  .tl{background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:6px 15px;margin-top:14px}
  .tl .ti{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line-2);font-size:13px;align-items:center}
  .tl .ti:last-child{border-bottom:0}
  .tl .pi{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--success)}
  .tl .tdesc{flex:1;min-width:0;font-weight:600}
  .tl .tsub{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
  .submit{margin-top:18px;width:100%;justify-content:center}
  .submit[disabled]{opacity:.5;cursor:not-allowed}

  /* 底部弹层（提交六字段） */
  .sheet-mask{position:fixed;inset:0;background:rgba(20,24,40,.42);z-index:60;opacity:0;pointer-events:none;transition:.22s}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:460px;
         background:#fff;border-radius:22px 22px 0 0;z-index:61;padding:8px 20px calc(20px + env(safe-area-inset-bottom));
         transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
  .sheet.show{transform:translate(-50%,0)}
  .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
  .sheet .sh-desc{font-size:17px;font-weight:800;line-height:1.4}
  .sheet .sh-meta{font-size:12px;color:var(--ink-3);margin-top:5px}
  .sheet .sh-preset{font-size:13px;color:var(--ink-2);margin-top:10px;background:var(--surface-2);
                  border-radius:10px;padding:10px 11px;line-height:1.55}
  .sheet .sh-preset b{color:var(--primary-600)}
  .sheet .sh-preset.editable{border:1.5px solid var(--line)}
  .sheet .sh-preset.editable input,.sheet .sh-preset.editable textarea{width:100%;border:0;background:transparent;font-family:var(--font);font-size:13px;color:var(--ink);margin-top:4px;resize:none}
  .sheet .sh-preset.editable input:focus,.sheet .sh-preset.editable textarea:focus{outline:none}
  .sheet .q{font-size:13.5px;font-weight:700;color:var(--ink-2);margin:16px 0 8px}
  .sheet textarea.note-in{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;
           font-family:var(--font);font-size:14px;background:var(--surface-2);resize:none;line-height:1.55}
  .sheet textarea.note-in:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-ring)}
  .sheet .save{width:100%;margin-top:16px;justify-content:center;padding:14px;font-size:15px;font-weight:700}

  /* 庆祝 */
  .cele{position:fixed;inset:0;z-index:80;background:rgba(20,28,46,.55);display:none;
        align-items:center;justify-content:center;padding:30px}
  .cele.show{display:flex;animation:fade .25s ease}
  .cele-box{background:#fff;border-radius:24px;padding:34px 32px;text-align:center;max-width:330px;width:100%;
            animation:pop .35s cubic-bezier(.2,1.3,.5,1);position:relative;overflow:hidden}
  .cele-glow{position:absolute;left:50%;top:42px;width:170px;height:170px;margin-left:-85px;border-radius:50%;
    background:radial-gradient(circle,rgba(79,70,229,.20),transparent 65%);animation:cele-pulse 1.7s ease-in-out infinite;pointer-events:none}
  .cele-illus{width:124px;height:124px;margin:0 auto 4px;position:relative;z-index:1;animation:pop .45s var(--ease-spring) both}
  .cele-title{font-size:20px;font-weight:800;color:var(--primary-600);margin-top:14px;position:relative;z-index:1}
  .cele-text{font-size:14px;color:var(--ink-2);line-height:1.7;margin-top:10px;position:relative;z-index:1}
  .cele-coach{margin-top:14px;background:rgba(79,70,229,.08);border:1px solid rgba(79,70,229,.18);border-radius:13px;padding:11px 13px;font-size:12.5px;color:var(--primary-600);text-align:left;line-height:1.6;position:relative;z-index:1}
  .cele-coach .lbl{font-weight:800;font-size:11px;letter-spacing:.3px;display:block;margin-bottom:4px;color:var(--brand-deep)}
  .cele-coach .lbl .ic-svg{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:3px}
  .cele-btn{width:100%;margin-top:20px;justify-content:center;position:relative;z-index:1}

  .block{margin:60px 18px;text-align:center}
  .block .em{font-size:54px}
  .block h2{font-size:19px;font-weight:800;margin:14px 0 8px}
  .block p{font-size:14px;color:var(--ink-2);line-height:1.7}
  .code-box{margin-top:14px;background:var(--surface-2);border:1.5px dashed var(--line);border-radius:13px;
            padding:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-2);
            word-break:break-all;text-align:left;max-height:140px;overflow-y:auto}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-30px);background:#1a2233;color:#fff;
         font-size:13px;font-weight:600;padding:10px 18px;border-radius:11px;z-index:90;opacity:0;transition:.25s;
         pointer-events:none;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}

  /* 图标 / 插画 / 生命感 */
  .ic-svg{display:block}
  .nav button .ic{display:inline-flex;align-items:center;justify-content:center}
  .nav button .ic .ic-svg{width:22px;height:22px}
  .bell{display:flex;align-items:center;justify-content:center}
  .bell .ic-svg{width:20px;height:20px;opacity:.92}
  .illust{width:140px;height:140px;margin:0 auto 8px;display:block;animation:pop .5s var(--ease-spring) both}
  .empty .illust{margin-bottom:6px}
  .habits .habit{animation:rise .42s var(--ease-spring) both}
  .confetti{position:absolute;top:46px;left:50%;width:7px;height:7px;border-radius:2px;opacity:0;z-index:2;
    animation:confetti-burst .9s var(--ease-out) forwards}
  @keyframes confetti-burst{
    0%{opacity:0;transform:translate(-50%,0) scale(.3)}
    25%{opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--rot)) scale(1)}
  }

  /* 旅程条 */
  .journey{margin:18px 4px 4px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;
           padding:15px 17px;box-shadow:var(--sh-xs);cursor:pointer;transition:border-color var(--dur),box-shadow var(--dur),transform var(--dur) var(--ease-spring)}
  .journey:active{transform:scale(.99)}
  .journey:hover{border-color:var(--brand-line);box-shadow:var(--sh-sm)}
  .journey .j-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .journey .j-day{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .journey .j-day .ic-svg{width:20px;height:20px;color:var(--primary)}
  .journey .j-lit{font-size:12.5px;color:var(--ink-2);font-weight:600;white-space:nowrap}
  .journey .j-lit b{color:var(--primary);font-size:14px}
  .journey .j-bar{height:8px;border-radius:999px;background:var(--surface-2);margin-top:11px;overflow:hidden}
  .journey .j-fill{height:100%;border-radius:999px;background:var(--brand);width:0;transition:width .6s var(--ease-spring)}
  .journey .j-hint{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:flex;align-items:center;gap:6px}
  .journey .j-hint .ic-svg{width:14px;height:14px}

  /* 开场三屏 */
  .ob{position:fixed;inset:0;z-index:100;background:#fff;display:none;flex-direction:column;
      padding:calc(env(safe-area-inset-top) + 30px) 28px calc(env(safe-area-inset-bottom) + 28px);align-items:center;justify-content:center;text-align:center}
  .ob.show{display:flex;animation:fade .3s ease}
  .ob .ob-ill{width:168px;height:168px;margin:0 auto 6px}
  .ob .ob-kicker{font-size:12px;font-weight:700;color:var(--primary-600);letter-spacing:.4px;margin-bottom:10px}
  .ob h2{font-size:23px;font-weight:800;margin:0 0 12px;letter-spacing:.2px}
  .ob p{font-size:15px;color:var(--ink-2);line-height:1.75;margin:0 auto;max-width:320px}
  .ob .ob-dots{display:flex;gap:7px;margin:26px 0 22px}
  .ob .ob-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.25s}
  .ob .ob-dots i.on{background:var(--primary);width:20px;border-radius:999px}
  .ob .ob-btns{display:flex;gap:10px;width:100%;max-width:320px}
  .ob .ob-skip{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:18px;font-size:13px;color:var(--ink-3);font-weight:600}

  /* 三周地图 overlay */
  .mapview{position:fixed;inset:0;z-index:85;background:#fff;display:none;flex-direction:column}
  .mapview.show{display:flex;animation:fade .25s ease}
  .mapview .mv-head{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
  .mapview .mv-head .ic-svg{width:22px;height:22px;color:var(--primary);cursor:pointer;flex:0 0 22px}
  .mapview .mv-head h3{margin:0;font-size:17px;font-weight:800}
  .mapview .mv-body{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
  .mv-day{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .mv-day.cur{border-color:var(--primary);box-shadow:var(--sh-brand)}
  .mv-day.free{opacity:.6}
  .mv-day .mv-dtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mv-day .mv-dname{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .mv-day .mv-dname .pill{font-size:11px;font-weight:700;color:var(--primary-600);background:var(--primary-soft);padding:2px 9px;border-radius:999px}
  .mv-day .mv-dstat{font-size:12px;color:var(--ink-3);font-weight:600}
  .mv-day .mv-tk{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;padding:4px 0}
  .mv-day .mv-tk .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .mv-day .mv-tk .dot.done{background:var(--success)}
  .mv-day .mv-tk .dot.todo{background:var(--brand-line)}
  .mv-day .mv-tk .dot.future{background:var(--line)}

  @media (prefers-reduced-motion:reduce){
    .habits .habit,.illust,.cele-illus,.cele-glow,.ob{animation:none !important}
    .confetti{display:none !important}
  }
</style>

<body>
<div class="phone">
  <div class="topbar">
    <div class="top-row">
      <div>
        <div class="hi" id="greet">你好</div>
        <div class="who"><span id="who-name">学员</span><span class="role" id="who-role"></span></div>
      </div>
      <div class="bell" id="bell" aria-hidden="true"></div>
      <button id="ai-settings-btn-m" class="ai-mini" onclick="ALV2.aiSettings.open()" aria-label="AI 设置">
        <span class="dot"></span><span class="t">AI</span>
      </button>
    </div>
  </div>

  <div class="idcard hidden" id="idcard">

    <div class="txt" id="id-txt"></div>

<!-- 提交弹层（六字段） -->
<div class="sheet-mask" id="sheet-mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>

<script src="v2-core.js?v=14"></script>
<script src="sample-data.js?v=14"></script>
<script src="icons.js?v=14"></script>
<script src="ai.js?v=14"></script>
<script src="ai-settings.js?v=15"></script>
<script>
(function(){
  'use strict';
  var course=null, me=null, sku=null, submissions=[], screen='today', curBehavior=null;
  var schedule=null, curDayIdx=-1, comp={done:0,total:0,complete:false};
  var behaviorDay={}; // behaviorId -> day index in schedule

  function b64encode(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function b64decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function $(id){return document.getElementById(id);}
  function paintIcons(){
    document.querySelectorAll('[data-ic]').forEach(function(el){
      el.innerHTML = AL.icon(el.getAttribute('data-ic'), {size: el.classList.contains('ic')?22:20});
    });
    var bell=$('bell'); if(bell) bell.innerHTML = AL.icon('leaf',{size:20});
  }
  function isWend(d){return d.getDay()===0||d.getDay()===6;}
  function fmtMD(d){return (d.getMonth()+1)+'月'+d.getDate()+'日';}
  function greet(){var h=new Date().getHours();return h<6?'凌晨好':h<11?'早上好':h<13?'中午好':h<18?'下午好':h<22?'晚上好':'夜深了';}

  function loadFromHash(){
    var h=location.hash.replace(/^#/,'');
    if(!h) return false;
    var m=h.match(/(?:^|&)d=([^&]+)/);
    if(!m) return false;
    try{
      var obj=JSON.parse(b64decode(m[1]));
      if(!obj.c||!obj.s) return false;
      course=obj.c; me=obj.s; sku=course.sku||'demo';
      ALV2.store.set(sku,'config',course);
      if(!obj.preview){
        var st=ALV2.store.get(sku,'students',[]);
        if(!st.some(function(x){return x.id===me.id;})){st.push({id:me.id,name:me.name});ALV2.store.set(sku,'students',st);}
      }
      submissions=ALV2.store.get(sku,'subs:'+me.id,[]);
      return true;
    }catch(e){return false;}
  }
  /* schema@5 自检：示范课若被旧版本污染或完全缺失，自动注入 schema@5 示范课（直访 student.html 也能干净进入） */
  function autoHealSample(){
    if(!ALV2_SAMPLE) return;
    try{
      var sku = ALV2_SAMPLE.SAMPLE_SKU;
      var old = ALV2.store.get(sku,'config',null);
      function _injectDemo(reason){
        var c = ALV2_SAMPLE.build();
        ALV2.store.set(sku,'config',c);
        var sts = ALV2_SAMPLE.students();
        ALV2.store.set(sku,'students',sts);
        sts.forEach(function(st){
          ALV2.store.del(sku,'subs:'+st.id);
          ALV2.store.set(sku,'subs:'+st.id, ALV2_SAMPLE.buildSubmissions(c,st));
        });
        console.log('[student.html] 示范课 '+reason+'（'+sku+'）');
      }
      // 分支 1：localStorage 完全没示范课 → 直访学员端的常见场景（隐身 / 清缓存 / 换设备）
      if(!old){ _injectDemo('首次访问已自动注入'); return; }
      // 分支 2：有旧配置但 schema@5 不合规 → 清旧重注
      var sc = (old.scenarios||[])[0];
      var bad = !sc || !Array.isArray(sc.behaviors) || sc.behaviors.length<8
        || !Array.isArray(sc.methods) || sc.methods.length<1;
      if(bad){
        var sts0 = ALV2.store.get(sku,'students',null);
        if(Array.isArray(sts0)) sts0.forEach(function(st){ ALV2.store.del(sku,'subs:'+st.id); });
        ALV2.store.del(sku,'students');
        ALV2.store.del(sku,'config');
        _injectDemo('已自动重置被污染的版本');
      }
    }catch(e){ console.warn('[student.html] autoHealSample skipped', e); }
  }
  function loadDemo(){
    var skus=ALV2.store.listCourses();
    if(!skus.length) return false;
    sku=skus[0];
    course=ALV2.store.get(sku,'config',null);
    if(!course) return false;
    var st=ALV2.store.get(sku,'students',[]);
    if(!st.length){st=[{id:'demo_stu',name:'演示学员'}];ALV2.store.set(sku,'students',st);}
    me=st[0];
    submissions=ALV2.store.get(sku,'subs:'+me.id,[]);
    return true;
  }

  function allBehaviors(c){
    var out=[];(c.scenarios||[]).forEach(function(sc){(sc.behaviors||[]).forEach(function(b){out.push({b:b,scenario:sc});});});
    out.sort(function(a,b){return (a.b.order||0)-(b.b.order||0);});
    return out;
  }
  function findBehavior(id){var r=null;(course.scenarios||[]).forEach(function(sc){(sc.behaviors||[]).forEach(function(b){if(b.id===id)r={b:b,scenario:sc};});});return r;}
  function findScenarioOf(id){var r=null;(course.scenarios||[]).forEach(function(sc){(sc.behaviors||[]).forEach(function(b){if(b.id===id)r=sc;});});return r;}
  function metricHintOf(bid){
    var sc=findScenarioOf(bid);
    if(!sc||!sc.metric||!(sc.metric.label||sc.metric.name)) return '';
    return '<div class="metric-hint">本场景指标：'+esc(sc.metric.label||sc.metric.name)+(sc.metric.target?'（目标 '+esc(sc.metric.target)+'）':'')+'</div>';
  }

  function buildSchedule(){
    schedule = ALV2.schedulePlan(course);
    curDayIdx = currentWorkdayIndex(course.rhythm || ALV2.defaultRhythm());
    behaviorDay = {};
    schedule.days.forEach(function(d){ if(d.behavior) behaviorDay[d.behavior.behaviorId]=d.idx; });
    comp = ALV2.completion(course, submissions);
  }
  function currentWorkdayIndex(rhythm){
    var start = ALV2.cohortStartDate(rhythm);
    var t0=new Date(); var today0=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate());
    var s0=new Date(start.getFullYear(),start.getMonth(),start.getDate());
    if(s0>today0) return -1;
    var idx=0,cur=new Date(s0);
    while(cur<today0){ if(!isWend(cur)) idx++; cur.setDate(cur.getDate()+1); }
    return Math.min(idx, (rhythm.windowWorkdays||15)-1);
  }

  function init(){
    paintIcons();
    if(!ALV2){document.body.innerHTML='<div class="block"><div class="em">'+illo('noaccess')+'</div><h2>页面加载失败</h2><p>核心脚本未载入，请检查网络后重试。</p></div>';return;}
    var ok=loadFromHash()||loadDemo();
    if(!ok){
      autoHealSample();   // 首次访问：自动注入示范课
      ok=loadFromHash()||loadDemo();
    }
    if(!ok){renderNoAccess();return;}
    buildSchedule();
    $('greet').textContent=greet();
    $('who-name').textContent=me.name||'学员';
    var theme=course.theme||'';
    if(theme){$('id-txt').innerHTML='把 <b>'+esc(theme)+'</b> 用到真实工作里';$('idcard').classList.remove('hidden');}
    document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){switchScreen(b.dataset.screen);};});
    bindSheet();
    bindOnboard();
    bindMap();
    switchScreen('today');
    maybeOnboard();
    if (ALV2.aiSettings) ALV2.aiSettings.refresh();
  }

  function renderNoAccess(){
    $('idcard').classList.add('hidden');
    $('nav').style.display='none';
    $('page').innerHTML='<div class="block">'+illo('noaccess')+'<h2>这个链接打不开</h2>'+
      '<p>学员端需要培训负责人发给你的专属链接才能打开。<br>在微信里点开那条链接，即可免登录使用。</p>'+
      '<p style="margin-top:16px;color:var(--ink-3);font-size:12.5px">如果你手上有课程码，也可以粘贴到下方：</p>'+
      '<textarea class="note-in" id="paste-code" rows="2" placeholder="把课程码粘贴到这里"></textarea>'+
      '<button class="btn btn-primary" style="width:100%;margin-top:12px;justify-content:center" onclick="__useCode()">打开</button></div>';
  }
  window.__useCode=function(){var v=$('paste-code').value.trim();if(!v){toast('请先粘贴课程码');return;}
    location.hash='d='+v.replace(/^d=/,'').replace(/^#/,'');location.reload();};

  function switchScreen(s){
    screen=s;
    document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.screen===s);});
    if(s==='today')renderToday();else if(s==='framework')renderFramework();else renderProgress();
  }

  /* 旅程条 */
  function journeyHTML(){
    if(!schedule) return '';
    var r=schedule.rhythm;
    var dayLabel = curDayIdx<0
      ? '将于 '+fmtMD(schedule.startDate)+' 开始'
      : ('第 '+(curDayIdx+1)+' 个工作日 / 共 '+r.windowWorkdays+' 天');
    var pct = comp.total? Math.round(comp.done/comp.total*100):0;
    var hint = curDayIdx<0 ? '到时每几天会有一个小行动等你' : '点开看看这三周怎么排';
    return '<div class="journey" id="journey">'+
      '<div class="j-top"><div class="j-day">'+AL.icon('compass',{size:20})+dayLabel+'</div>'+
      '<div class="j-lit">已完成 <b>'+comp.done+'</b> / '+comp.total+'</div></div>'+
      '<div class="j-bar"><div class="j-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="j-hint">'+AL.icon('path',{size:14})+hint+'</div></div>';
  }

  function renderToday(){
    var journey=journeyHTML();
    if(curDayIdx<0){
      $('page').innerHTML=journey+
        '<div class="sec"><h2>课程还没开始</h2></div>'+
        '<div class="empty">'+illo('today')+'<h3>先养好精神</h3><p>这门课将在 '+fmtMD(schedule.startDate)+' 正式开始，'+
        '之后三周里会有 10 个真实工作场景的小行动，陪你把课堂所学用起来。</p></div>';
      var jb=$('journey'); if(jb) jb.onclick=openMap;
      return;
    }
    // 今日行为（若有）
    var todayB = schedule.days[curDayIdx] ? schedule.days[curDayIdx].behavior : null;
    var todayDone = todayB ? submissions.some(function(s){return s.behaviorId===todayB.behaviorId;}) : true;
    var html=journey;
    // 主区：展示全部 10 条行为（今日高亮，过去可补，未来锁定）
    var list=allBehaviors(course);
    html+='<div class="sec"><h2>高绩效行为</h2><div class="prog"><b>'+comp.done+'</b> / '+comp.total+' 已完成</div></div>';
    html+='<div class="habits">';
    list.forEach(function(it){
      var b=it.b;
      var dayIdx = behaviorDay[b.id];
      var isToday = (dayIdx===curDayIdx);
      var done = submissions.some(function(s){return s.behaviorId===b.id;});
      var future = (dayIdx!=null && curDayIdx < dayIdx);
      var cls = done?'done':(future?'locked':'');
      var st = done?'已完成':(future?'未到时间':'去记录');
      var lastSub = null; submissions.forEach(function(s){if(s.behaviorId===b.id) lastSub=s;});
      var dayBadge = dayIdx!=null ? ('<span class="daybadge">第 '+(dayIdx+1)+' 个工作日</span>') : '';
      var kindBadge = '<span class="kind '+(b.kind==='key'?'key':'micro')+'">'+(b.kind==='key'?'关键行为':'微行为')+'</span>';
      html+='<div class="habit '+cls+'" data-b="'+esc(b.id)+'">'+
        '<div class="ring"></div><div class="main">'+
        '<div class="desc">'+esc(b.action)+'</div>'+
        '<div class="meta">场景：'+esc(b.scene)+'</div>'+
        dayBadge+kindBadge+ metricHintOf(b.id)+
        (done&&lastSub? '<div class="result"><b>结果：</b>'+esc(lastSub.resultImpact||'（已记录）')+'</div>' :
          (!done&&!future? '<div class="why"><b>为什么是它：</b>'+esc(b.challenge||'把课堂方法用进真实工作')+'</div>' : ''))+
        '</div><div class="st">'+st+'</div></div>';
    });
    html+='</div>';
    if(todayB && !todayDone){
      // 顶部强调今日
      var tb=findBehavior(todayB.behaviorId);
      if(tb){
        html='<div class="sec"><h2>今日焦点</h2></div>'+
          '<div class="habit'+(todayDone?' done':'')+'" data-b="'+esc(todayB.behaviorId)+'" style="border-color:var(--primary);box-shadow:var(--sh-brand)">'+
          '<div class="ring"></div><div class="main">'+
          '<div class="desc">'+esc(tb.b.action)+'</div>'+
          '<div class="meta">场景：'+esc(tb.b.scene)+'</div>'+
          '<span class="daybadge">今天</span><span class="kind '+(tb.b.kind==='key'?'key':'micro')+'">'+(tb.b.kind==='key'?'关键行为':'微行为')+'</span>'+
          metricHintOf(todayB.behaviorId)+
          '<div class="why"><b>为什么是它：</b>'+esc(tb.b.challenge||'')+'</div>'+
          '</div><div class="st">去记录</div></div>'+journey+html.replace(/<div class="sec">[\s\S]*?<\/div>/,'');
      }
    }
    $('page').innerHTML=html;
    $('page').querySelectorAll('[data-b]').forEach(function(el){
      var id=el.dataset.b;
      if(el.classList.contains('locked')) return;
      el.onclick=function(){openCheckIn(id);};
    });
    var jb=$('journey'); if(jb) jb.onclick=openMap;
  }

  function renderFramework(){
    var scs=course.scenarios||[];
    if(!scs.length){$('page').innerHTML='<div class="empty">'+illo('framework')+'<h3>框架还没搭好</h3><p>这门课的学习框架还没配置，稍等培训负责人搭好场景与行为。</p></div>';return;}
    var html='<div class="sec"><h2>学习框架</h2><div class="prog">只读 · 随时回顾</div></div>';
    scs.forEach(function(sc,idx){
      html+='<div class="loop'+(idx===0?' open':'')+'"><div class="loop-head" data-loop="'+idx+'">'+
        '<div class="n">'+(idx+1)+'</div><div class="t">'+esc(sc.name||sc.title||'场景')+'</div><div class="arr">▾</div></div><div class="loop-body">';
      if(sc.challenge)html+='<div class="challenge">挑战：'+esc(sc.challenge)+'</div>';
      if(sc.methods&&sc.methods.length){html+='<div class="sub-h">方法工具</div>';
        sc.methods.forEach(function(m){html+='<div class="mrow"><div class="dot"></div><div><span class="mn">'+esc(m.name)+'</span>'+(m.desc?' <span class="md">· '+esc(m.desc)+'</span>':'')+'</div></div>';});}
      if(sc.behaviors&&sc.behaviors.length){html+='<div class="sub-h">高绩效行为（'+(sc.behaviors.filter(function(b){return b.kind==='key';}).length)+' 关键 + '+(sc.behaviors.filter(function(b){return b.kind!=='key';}).length)+' 微）</div>';
        sc.behaviors.forEach(function(b){
          html+='<div class="mrow"><div class="dot" style="background:'+(b.kind==='key'?'#993556':'var(--success)')+'"></div>'+
            '<div><span class="mn">'+esc(b.action)+'</span>'+
            (b.kind==='key'?' <span class="md" style="color:#993556">· 关键行为</span>':'')+
            '<div class="six"><b>场景：</b>'+esc(b.scene||'')+'<br><b>挑战：</b>'+esc(b.challenge||'')+
            (b.expectedResult?'<br><b>预期结果：</b>'+esc(b.expectedResult):'')+'</div></div></div>';
        });}
      html+='</div></div>';
    });
    $('page').innerHTML=html;
    $('page').querySelectorAll('[data-loop]').forEach(function(el){el.onclick=function(){el.parentElement.classList.toggle('open');};});
  }

  function renderProgress(){
    var html='<div class="sec"><h2>我的迁移记录</h2><div class="prog">已完成 '+comp.done+' / '+comp.total+'</div></div>';
    html+='<div class="stats"><div class="stat"><div class="num">'+comp.done+'<span style="font-size:14px;color:var(--ink-3)">/'+comp.total+'</span></div><div class="lbl">已完成行为</div></div>'+
      '<div class="stat"><div class="num">'+ (schedule?schedule.rhythm.windowWorkdays:15) +'</div><div class="lbl">三周工作日</div></div>'+
      '<div class="stat"><div class="num">'+ (comp.complete?'✓':'…') +'</div><div class="lbl">迁移完成度</div></div></div>';
    var sorted=submissions.slice().sort(function(a,b){return b.ts-a.ts;});
    if(sorted.length){
      html+='<div class="tl">';
      sorted.forEach(function(s){
        var it=findBehavior(s.behaviorId);
        html+='<div class="ti"><div class="pi"></div><div><div class="tdesc">'+esc(it?it.b.action:'行为')+'</div>'+
          '<div class="tsub">'+esc(s.resultImpact||'（已记录）')+'</div></div></div>';
      });
      html+='</div>';
    }else{html+='<div class="empty">'+illo('progress')+'<h3>还没有记录哦</h3><p>去「今日」完成第一个高绩效行为，开始你的迁移。</p></div>';}
    if(comp.complete){
      html+='<button class="btn btn-primary submit" id="btn-submit" style="justify-content:center">'+AL.icon('send',{size:18})+'提交迁移给负责人</button>';
    }else{
      html+='<button class="btn btn-ghost submit" id="btn-submit" disabled style="justify-content:center">还差 '+(comp.total-comp.done)+' 条完成，才能提交</button>';
    }
    $('page').innerHTML=html;
    $('btn-submit').onclick=exportSubmit;
  }

  /* 原创插画 */
  function illo(name){
    var C={brand:'#4F46E5',deep:'#4338CA',soft:'#EEF0FF',line:'#C7CBFF',green:'#15A36E',gsoft:'#E7F7EF',amber:'#B9791B',aspark:'#FBE9B0'};
    if(name==='today')return '<svg class="illust" viewBox="0 0 140 140" fill="none" aria-hidden="true">'+
      '<ellipse cx="70" cy="124" rx="42" ry="7" fill="'+C.soft+'"/>'+
      '<path d="M52 120c0-11 4-19 18-19s18 8 18 19" fill="#fff" stroke="'+C.line+'" stroke-width="2.4"/>'+
      '<path d="M70 101V70" stroke="'+C.brand+'" stroke-width="3" stroke-linecap="round"/>'+
      '<path d="M70 78c-15-2-23-12-23-27 15 0 23 11 23 27z" fill="'+C.gsoft+'" stroke="'+C.green+'" stroke-width="2.4"/>'+
      '<path d="M70 82c0-13 8-23 23-25 0 13-8 23-23 25z" fill="'+C.soft+'" stroke="'+C.brand+'" stroke-width="2.4"/>'+
      '<path d="M106 40l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="'+C.aspark+'"/></svg>';
    if(name==='framework')return '<svg class="illust" viewBox="0 0 140 140" fill="none" aria-hidden="true">'+
      '<rect x="30" y="32" width="80" height="76" rx="15" fill="'+C.soft+'"/>'+
      '<path d="M40 94c10-6 14-23 27-23s10 17 25 13" stroke="'+C.line+'" stroke-width="2.6" stroke-dasharray="2 7" stroke-linecap="round"/>'+
      '<circle cx="40" cy="94" r="4.5" fill="'+C.brand+'"/>'+
      '<circle cx="92" cy="80" r="11" fill="#fff" stroke="'+C.brand+'" stroke-width="2.4"/>'+
      '<path d="M92 74l2.6 5.4 5.4 2.6-5.4 2.6L92 90l-2.6-5.4-5.4-2.6 5.4-2.6z" fill="'+C.brand+'"/></svg>';
    if(name==='progress')return '<svg class="illust" viewBox="0 0 140 140" fill="none" aria-hidden="true">'+
      '<path d="M30 110c14-4 18-18 36-18s14 14 34 10" stroke="'+C.line+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>'+
      '<circle cx="30" cy="110" r="5" fill="'+C.brand+'"/>'+
      '<path d="M98 70v36" stroke="'+C.brand+'" stroke-width="3" stroke-linecap="round"/>'+
      '<path d="M98 70h22l-7 9 7 9h-22z" fill="'+C.gsoft+'" stroke="'+C.green+'" stroke-width="2.2" stroke-linejoin="round"/>'+
      '<circle cx="46" cy="96" r="2.4" fill="'+C.amber+'"/><circle cx="68" cy="89" r="2.4" fill="'+C.amber+'"/></svg>';
    if(name==='noaccess')return '<svg class="illust illust-sm" viewBox="0 0 140 140" fill="none" aria-hidden="true">'+
      '<rect x="34" y="40" width="38" height="30" rx="7" fill="'+C.soft+'" stroke="'+C.line+'" stroke-width="2.4"/>'+
      '<path d="M44 55h18M44 63h12" stroke="'+C.brand+'" stroke-width="2.4" stroke-linecap="round"/>'+
      '<path d="M86 78c10-10 24-10 30 0" stroke="'+C.line+'" stroke-width="3" stroke-linecap="round"/>'+
      '<circle cx="104" cy="62" r="13" fill="#fff" stroke="'+C.brand+'" stroke-width="2.6"/>'+
      '<path d="M104 56v7l4 3" stroke="'+C.brand+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M99 92l10 10" stroke="'+C.line+'" stroke-width="3" stroke-linecap="round"/></svg>';
    if(name==='done')return '<svg class="cele-illus" viewBox="0 0 124 124" fill="none" aria-hidden="true">'+
      '<circle cx="62" cy="62" r="46" stroke="'+C.soft+'" stroke-width="3"/>'+
      '<path d="M44 64l12 12 26-28" stroke="'+C.brand+'" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M99 24l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" fill="'+C.aspark+'"/></svg>';

  function burstConfetti(){
    var box=document.getElementById('cele'); if(!box) return;
    var host=box.querySelector('.cele-box');
    host.querySelectorAll('.confetti').forEach(function(c){c.remove();});
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cols=['#4F46E5','#15A36E','#B9791B','#7C74F0','#C7CBFF'];
    for(var i=0;i<14;i++){
      var s=document.createElement('span'); s.className='confetti';
      var ang=Math.random()*Math.PI*2, dist=58+Math.random()*72;
      s.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
      s.style.setProperty('--dy',(Math.sin(ang)*dist-30).toFixed(1)+'px');
      s.style.setProperty('--rot',(Math.random()*540-270).toFixed(0)+'deg');
      s.style.background=cols[i%cols.length];
      s.style.animationDelay=(Math.random()*0.16).toFixed(2)+'s';
      if(Math.random()>0.5) s.style.borderRadius='50%';
      host.appendChild(s);
    }
  }

  /* 提交弹层 */
  function bindSheet(){
    $('sheet-mask').onclick=closeSheet;
    $('ck-save').onclick=saveCheckIn;
  }
  function openCheckIn(id){
    var it=findBehavior(id);if(!it)return;curBehavior=it;var b=it.b;
    var dayIdx=behaviorDay[b.id];
    if(dayIdx!=null && curDayIdx<dayIdx){toast('还没到这一天，先去做已解锁的行为');return;}
    $('sh-desc').textContent=b.action;
    $('sh-meta').textContent=(b.kind==='key'?'关键行为（≤5 分钟）':'微行为（约 30 秒）')+(b.kind==='key'?' · 场景/挑战/行动可改':' · 场景/挑战/行动由讲师预设');
    // 预设区
    var preset='<div class="sh-preset'+(b.kind==='key'?' editable':'')+'" id="sh-preset">';
    if(b.kind==='key'){
      preset+='<div><b>场景</b><input id="ck-scene" value="'+esc(b.scene)+'" placeholder="这条行为发生在哪个真实场景" /></div>'+
        '<div style="margin-top:8px"><b>挑战</b><input id="ck-ch" value="'+esc(b.challenge||'')+'" placeholder="在该场景下你面对的挑战" /></div>'+
        '<div style="margin-top:8px"><b>行动</b><textarea id="ck-act" rows="2" placeholder="你要采取的具体行动">'+esc(b.action)+'</textarea></div>';
    }else{
      preset+='<b>场景：</b>'+esc(b.scene)+'<br><b>挑战：</b>'+esc(b.challenge||'')+'<br><b>行动：</b>'+esc(b.action);
    }
    preset+='</div>';
    $('sh-preset-wrap').innerHTML=preset;
    // 已有提交回填
    var last=null; submissions.forEach(function(s){if(s.behaviorId===id)last=s;});
    $('ck-result').value=last?last.resultImpact:'';
    if(b.kind==='key'){
      $('sh-extra').classList.remove('hidden');
      $('ck-diff').value=last?last.difficulty:'';
      $('ck-future').value=last?last.futureApplication:'';
    }else{
      $('sh-extra').classList.add('hidden');
    }
    $('sheet').classList.add('show');$('sheet-mask').classList.add('show');
  }
  function closeSheet(){$('sheet').classList.remove('show');$('sheet-mask').classList.remove('show');}
  function saveCheckIn(){
    if(!curBehavior)return;
    var b=curBehavior.b;
    var isKey=b.kind==='key';
    var scene=isKey?($('ck-scene').value.trim()||b.scene):b.scene;
    var challenge=isKey?($('ck-ch').value.trim()||b.challenge||''):b.challenge;
    var action=isKey?($('ck-act').value.trim()||b.action):b.action;
    var resultImpact=($('ck-result').value||'').trim();
    if(!resultImpact){toast('请先写一句结果和影响');return;}
    var sub={
      behaviorId:b.id, scene:scene, challenge:challenge, action:action,
      edited: isKey && (scene!==b.scene||challenge!==(b.challenge||'')||action!==b.action),
      resultImpact:resultImpact,
      difficulty: isKey?($('ck-diff').value||'').trim():'',
      futureApplication: isKey?($('ck-future').value||'').trim():'',
      ts:Date.now()
    };
    // 同行为只保留最新一条
    submissions=submissions.filter(function(s){return s.behaviorId!==b.id;});
    submissions.push(sub);
    ALV2.store.set(sku,'subs:'+me.id,submissions);
    closeSheet();
    buildSchedule(); renderToday();
    showCelebrate(b, sub);
    // AI 内容感知反馈（有 Key 时走真 LLM，否则用规则 mock）
    var aiCfg = ALV2.getAIConfig();
    if(aiCfg && aiCfg.apiKey){
      var ctx={kind:b.kind, scene:scene, challenge:challenge, action:action, edited:sub.edited,
               resultImpact:resultImpact, difficulty:sub.difficulty, futureApplication:sub.futureApplication,
               metricLabel:(curBehavior.scenario.metric&&curBehavior.scenario.metric.label)||''};
      ALV2.ai.studentFeedback(ctx, aiCfg).then(function(fb){
        showCelebrate(b, sub, fb);
      }).catch(function(){});
    }
  }
  function showCelebrate(b, sub, aiObj){
    var title='记下来了，这一笔真有价值';
    var text='你把课堂方法用进了真实工作——这一步，才是培训真正发生的地方。';
    if(b.kind==='key'){
      title='关键行为完成，深度复盘见';
      text='这条关键行为你记录得很完整，讲师/HR 会据此给你针对性反馈。';
    }
    $('cele-illus').innerHTML=illo('done');
    $('cele-title').textContent=title;$('cele-text').textContent=text;
    $('cele-coach').innerHTML='<span class="lbl">'+AL.icon('ai',{size:14})+'AI 陪练 · 给你的反馈</span>'+esc(coachText(b,sub,aiObj));
    if(aiObj || !ALV2.hasAI()) burstConfetti();
    $('cele').classList.add('show');
    $('cele-ok').onclick=function(){$('cele').classList.remove('show');};
  }
  function coachText(b,sub,aiObj){
    if(aiObj){
      var parts=[aiObj.praise||''];
      if(aiObj.next)parts.push(aiObj.next);
      if(aiObj.bigPic)parts.push(aiObj.bigPic);
      return parts.join(' ');
    }
    var lines=[];
    lines.push('你记录了：'+(sub.resultImpact||'这一步的收获')+'——把所学用起来，比任何"坚持打卡"都重要。');
    if(sub.futureApplication) lines.push('你已规划未来怎么用，这会让迁移真正沉淀下来。');
    else if(b.kind==='key') lines.push('关键行为建议补一句"未来还怎么用"，讲师复盘会更有针对性。');
    return lines.join(' ');
  }

  /* 开场三屏 */
  var obIdx=0, obScreens=[];
  function maybeOnboard(){
    if(!course||!me) return;
    var flag='al_v2:'+sku+':onboard:'+me.id;
    if(localStorage.getItem(flag)) return;
    obScreens=buildOnboardScreens();
    if(!obScreens.length) return;
    obIdx=0; paintOnboard();
    $('ob').classList.add('show');
  }
  function buildOnboardScreens(){
    var needs=course.needs||'';
    var firstChallenge=(course.scenarios&&course.scenarios[0]&&course.scenarios[0].challenge)||'';
    var r=(course.rhythm||ALV2.defaultRhythm());
    var sc=[];
    sc.push({ill:'why',kicker:'为什么是这门课',title:'先看清，你要去哪',
      text: needs? (needs.length>90? needs.slice(0,90)+'…' : needs)
                 : (firstChallenge||'这门课帮你把培训学到的东西，真正用回工作里。')});
    sc.push({ill:'step',kicker:'这三周会发生什么',title:'三周，一点点就好',
      text:'一共 '+r.windowWorkdays+' 个工作日，安排 '+r.totalActions+' 个真实工作场景的小行动（5 天不安排，不连续）。'+
           '每个行动都锚定在场景里——不是打卡，是把方法真的用起来。'});
    sc.push({ill:'sprout',kicker:'三周后，你会不一样在哪',title:'回头看，你已经变了',
      text: '你会发现自己面对同样的工作场景，反应不一样了：决策有依据、协同更主动、结果可衡量。'});
    return sc;
  }
  function paintOnboard(){
    var s=obScreens[obIdx];
    $('ob-ill').innerHTML=illo(s.ill);
    $('ob-kicker').textContent=s.kicker;
    $('ob-title').textContent=s.title;
    $('ob-text').textContent=s.text;
    var dots=$('ob-dots'); dots.innerHTML='';
    obScreens.forEach(function(_,i){var d=document.createElement('i');if(i===obIdx)d.className='on';dots.appendChild(d);});
    $('ob-prev').style.visibility = obIdx===0?'hidden':'visible';
    $('ob-next').textContent = obIdx===obScreens.length-1?'开始':'下一步';
  }
  function bindOnboard(){
    $('ob-next').onclick=function(){
      if(obIdx<obScreens.length-1){obIdx++;paintOnboard();}
      else finishOnboard();
    };
    $('ob-prev').onclick=function(){ if(obIdx>0){obIdx--;paintOnboard();} };
    $('ob-skip').onclick=finishOnboard;
  }
  function finishOnboard(){
    $('ob').classList.remove('show');
    try{localStorage.setItem('al_v2:'+sku+':onboard:'+me.id,'1');}catch(e){}
  }

  /* 三周地图 */
  function bindMap(){ $('mv-close').onclick=function(){$('mapview').classList.remove('show');}; }
  function openMap(){
    if(!schedule) return;
    var body=$('mv-body');
    var html='';
    schedule.days.forEach(function(d,idx){
      var isCur = idx===curDayIdx;
      var b=d.behavior;
      var done = b ? submissions.some(function(s){return s.behaviorId===b.behaviorId;}) : false;
      var stat = !b ? '休息日' : (idx<curDayIdx ? (done?'已完成':'已错过') : (idx===curDayIdx?(done?'今天已完成':'今天'):(done?'已完成':'待开始')));
      html+='<div class="mv-day'+(isCur?' cur':'')+(!b?' free':'')+'">'+
        '<div class="mv-dtop"><div class="mv-dname">第 '+(idx+1)+' 个工作日 <span class="pill">'+fmtMD(d.date)+'</span></div>'+
        '<div class="mv-dstat">'+stat+'</div></div>';
      if(b){
        var cls = done?'done':(idx<=curDayIdx?'todo':'future');
        html+='<div class="mv-tk"><span class="dot '+cls+'"></span>'+esc(b.action)+
          (b.kind==='key'?' <span style="color:#993556;font-weight:700">· 关键</span>':'')+'</div>';
      }else{
        html+='<div class="mv-tk" style="color:var(--ink-3)">这天没有安排，先忙手里的工作</div>';
      }
      html+='</div>';
    });
    body.innerHTML=html;
    $('mapview').classList.add('show');
  }

  /* 提交码回流 */
  function exportSubmit(){
    if(!comp.complete){toast('还有行为没完成，无法提交');return;}
    var payload=b64encode(JSON.stringify({sku:sku,studentId:me.id,studentName:me.name,submissions:submissions}));
    var html='<div class="sec" style="margin-top:0"><h2>把迁移记录发给负责人</h2></div>'+
      '<p style="font-size:13.5px;color:var(--ink-2);padding:0 4px">把下面的「迁移码」复制，用微信发给你的培训负责人。'+
      '对方在电脑上导入后，就能看到你每条行为真实用到了哪、带来了什么结果——你的每一次迁移，都值得被看见。</p>'+
      '<div class="code-box" id="submit-code" style="margin:14px 4px">'+esc(payload)+'</div>'+
      '<button class="btn btn-primary" style="width:100%;justify-content:center;margin:6px 0 0" onclick="__copyCode()">'+AL.icon('copy',{size:16})+'复制迁移码</button>'+
      '<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:10px" onclick="switchScreen(\'progress\')">返回</button>';
    $('page').innerHTML=html;
    window.__copyCode=function(){var t=$('submit-code').textContent;navigator.clipboard&&navigator.clipboard.writeText(t);toast('已复制，去微信发给负责人吧');};
  }

  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}

  init();
})();
</script>
